name: Nhắc giỗ hằng ngày
on:
  schedule:
    - cron: '0 0 * * *'     # 00:00 UTC = 7:00 sáng giờ Việt Nam
  workflow_dispatch:
    inputs:
      thu:
        description: 'Gửi thông báo thử ngay tới mọi máy đã bật nhắc'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  nhac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install web-push@3 --no-save --no-audit --no-fund
      - name: Gửi nhắc giỗ
        run: node scripts/nhac-gio.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          APP_URL: ${{ secrets.APP_URL }}
          THU: ${{ github.event.inputs.thu }}
      # GitHub tự tắt lịch chạy nếu kho không có thay đổi 60 ngày – bước này giữ cho lịch luôn chạy
      - name: Giữ lịch chạy
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45*86400 )) ]; then
            date -u > .github/keepalive
            git config user.name "nhac-gio-bot"
            git config user.email "nhac-gio-bot@users.noreply.github.com"
            git add .github/keepalive && git commit -m "Giữ lịch nhắc giỗ" && git push
          fi
